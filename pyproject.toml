[project]
name = "clinical-rag"
version = "0.1.0"
description = "Multi-tenant clinical guideline RAG assistant — FastAPI + Supabase backend, offline ingestion/retrieval pipeline in rag/"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.26.5",
    "langchain>=0.3.30",
    "langchain-core>=0.3.86",
    "langchain-huggingface>=0.3.1",
    "langchain-chroma>=0.2.6",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.1.2",
    # Web application (multi-tenant SaaS layer)
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.1",
    # Database, auth, and storage — schema + RLS live in supabase/migrations/,
    # applied directly against the project, not by this app at startup.
    "supabase>=2.31.0",
    # LLM provider (only the one named by LLM_PROVIDER is actually imported
    # at runtime, but it must be installed to be selectable). openai's SDK
    # also backs "openrouter" — OpenRouter is OpenAI-compatible.
    "groq>=1.0.0",
    "openai>=2.48.0",
    # scripts/demo.py drives the API over HTTP
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# app/, rag/, and scripts/ are all regular packages (each has __init__.py)
# importable from the repo root. pytest already runs from the repo root,
# so no extra pythonpath entry is needed.
pythonpath = ["."]
